<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>احذف اسمك</title>

<style>
body{
background:#0a0a0a;
color:white;
font-family:Tahoma,sans-serif;
text-align:center;
padding:40px 20px;
}

h1{
color:#f5c542;
font-size:42px;
margin-top:40px;
}

p{
font-size:20px;
color:#ccc;
}

.box{
max-width:500px;
margin:auto;
background:#111;
padding:25px;
border-radius:20px;
margin-top:30px;
}

input{
width:100%;
padding:15px;
font-size:20px;
border:none;
border-radius:10px;
margin-bottom:15px;
}

button{
width:100%;
padding:18px;
font-size:22px;
background:#f5c542;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.price{
font-size:50px;
color:#f5c542;
font-weight:bold;
margin:20px 0;
}
</style>
</head>

<body>

<h1>احذف اسمك</h1>

<p>
احذف اسمك ورقمك من تطبيقات كشف الأرقام
بخصوصية كاملة ومتابعة حتى الإغلاق
</p>

<div class="box">

<div class="price">250 ريال</div>

<input type="tel" placeholder="05XXXXXXXX">

<button>
احذف اسمي الآن
</button>

</div>

</body>
</html>
