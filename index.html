<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>احذف اسمك</title>

<style>
body{
background:#000;
color:white;
font-family:Tahoma,sans-serif;
text-align:center;
padding:30px;
}

h1{
color:#f4c542;
font-size:55px;
}

.desc{
color:#ccc;
font-size:24px;
margin-bottom:40px;
}

.card{
background:#0b0b0b;
padding:30px;
border-radius:25px;
max-width:500px;
margin:auto;
}

.price{
font-size:70px;
font-weight:bold;
color:#f4c542;
margin-bottom:25px;
}

input{
width:90%;
padding:18px;
font-size:22px;
border-radius:12px;
border:none;
margin-bottom:20px;
}

button{
background:#f4c542;
color:#000;
border:none;
padding:18px;
width:95%;
font-size:28px;
font-weight:bold;
border-radius:15px;
cursor:pointer;
}
</style>
</head>

<body>

<h1>احذف اسمك</h1>

<p class="desc">
احذف اسمك ورقمك من تطبيقات كشف الأرقام
بخصوصية كاملة ومتابعة حتى الإغلاق
</p>

<div class="card">

<div class="price">250 ريال</div>

<input id="phone" placeholder="05XXXXXXXX">

<button onclick="sendWhatsapp()">
احذف اسمي الآن
</button>

</div>

<script>
function sendWhatsapp(){

let phone=document.getElementById('phone').value;

if(phone==""){
alert("أدخل رقم الجوال");
return;
}

let msg=
`طلب جديد - احذف اسمك

رقم العميل:
${phone}

الخدمة:
حذف الاسم من تطبيقات كشف الأرقام`;

window.location.href=
"https://wa.me/966554229903?text="+encodeURIComponent(msg);

}
</script>

</body>
</html>
