<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>احذف اسمك</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#000;
color:#fff;
padding:30px 15px;
text-align:center;
}

.logo{
font-size:55px;
font-weight:bold;
color:#f4c542;
margin-top:20px;
}

.subtitle{
font-size:22px;
color:#ccc;
margin:20px auto 40px;
max-width:700px;
line-height:1.8;
}

.card{
max-width:600px;
margin:auto;
background:#111;
padding:30px;
border-radius:25px;
border:1px solid #222;
}

.price{
font-size:60px;
font-weight:bold;
color:#f4c542;
margin-bottom:25px;
}

input{
width:100%;
padding:18px;
font-size:20px;
border:none;
border-radius:12px;
margin-bottom:15px;
}

.apps{
text-align:right;
margin:20px 0;
}

.apps h3{
margin-bottom:15px;
color:#f4c542;
}

.apps label{
display:block;
padding:10px 0;
font-size:18px;
}

button{
width:100%;
padding:18px;
font-size:24px;
font-weight:bold;
border:none;
border-radius:12px;
background:#f4c542;
color:#000;
cursor:pointer;
}

.features{
max-width:700px;
margin:50px auto;
}

.features div{
padding:12px;
font-size:18px;
}

.footer{
margin-top:40px;
color:#888;
font-size:14px;
}
</style>
</head>

<body>

<div class="logo">احذف اسمك</div>

<div class="subtitle">
احذف اسمك ورقمك من تطبيقات كشف الأرقام بخصوصية كاملة ومتابعة حتى الإغلاق.
</div>

<div class="card">

<div class="price">250 ريال</div>

<input id="name" type="text" placeholder="الاسم">

<input id="phone" type="tel" placeholder="05XXXXXXXX">

<div class="apps">

<h3>التطبيقات المطلوب الحذف منها</h3>

<label><input type="checkbox" id="truecaller"> Truecaller</label>

<label><input type="checkbox" id="sync"> Sync.me</label>

<label><input type="checkbox" id="numberbook"> NumberBook</label>

<label><input type="checkbox" id="eyecon"> Eyecon</label>

</div>

<button onclick="sendWhatsapp()">
احذف اسمي الآن
</button>

</div>

<div class="features">

<div>✅ خصوصية تامة</div>
<div>✅ متابعة حتى اكتمال الطلب</div>
<div>✅ دعم فني عبر واتساب</div>
<div>✅ تنفيذ يدوي لكل حالة</div>

</div>

<div class="footer">
DeleteCaller.com
</div>

<script>
function sendWhatsapp(){

let name = document.getElementById('name').value;
let phone = document.getElementById('phone').value;

if(phone === ""){
alert("الرجاء إدخال رقم الجوال");
return;
}

let apps = [];

if(document.getElementById('truecaller').checked)
apps.push("Truecaller");

if(document.getElementById('sync').checked)
apps.push("Sync.me");

if(document.getElementById('numberbook').checked)
apps.push("NumberBook");

if(document.getElementById('eyecon').checked)
apps.push("Eyecon");

let message =
`طلب جديد - احذف اسمك

الاسم:
${name}

رقم الجوال:
${phone}

التطبيقات المطلوبة:
${apps.join(", ")}

قيمة الخدمة:
250 ريال`;

window.location.href =
"https://wa.me/966554229903?text=" + encodeURIComponent(message);

}
</script>

</body>
</html>
